name: xtrading-local

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      TZ: UTC
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${DOCKER_GOPROXY:-https://goproxy.cn,direct}
        APK_MIRROR: ${APK_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/alpine}
    restart: unless-stopped
    env_file:
      - docker/.env
    environment:
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8040"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8040/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  app-data:
    name: xtrading-local_app-data
  mysql-data:
    name: xtrading-local_mysql-data
  redis-data:
    name: xtrading-local_redis-data
