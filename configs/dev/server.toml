[General]
AppName = "xtrading"
Version = "v10.1.0"
Debug = true
PprofAddr = "" # Pprof monitor address, "localhost:6060"
DisableSwagger = false
DisablePrintConfig = true
MenuFile = "menu.json" # Or use "menu_cn.json"
DenyOperateMenu = true

[General.Security]
Strict = false

[General.HTTP]
Addr = ":8040"
ShutdownTimeout = 10
ReadTimeout = 60
WriteTimeout = 60
IdleTimeout = 10
CertFile = ""
KeyFile = ""

[General.Root] # Super Administrator Account
ID = "root"
Username = "admin"
# Local development only. Production uses a one-time generated password.
PasswordHash = "$2a$10$su/QsY9c6O3H91I24m4iROIczoetjArsAR0zF3wcHUvP5sTksilM6"
Name = "Admin"

[Storage]

[Storage.Cache]
Type = "memory" # memory/badger/redis
Delimiter = ":"

[Storage.Cache.Memory]
CleanupInterval = 60

[Storage.Cache.Badger]
Path = "data/cache"

[Storage.Cache.Redis]
Addr = "127.0.0.1:6379"
Username = ""
Password = ""
DB = 1

[Storage.DB]
Debug = true
Type = "sqlite3" # sqlite3/mysql/postgres
# SQLite3 DSN
DSN = "data/ginadmin.db"
# MySQL DSN
# DSN = "root:123@tcp(127.0.0.1:3306)/ginadmin?charset=utf8mb4&parseTime=True&loc=Local"
# PostgreSQL DSN
# DSN = "host=db user=postgres password=123456 dbname=ginadmin port=5432 sslmode=disable TimeZone=Asia/Shanghai"
MaxLifetime = 86400
MaxIdleTime = 3600
MaxOpenConns = 100
MaxIdleConns = 50
TablePrefix = ""
AutoMigrate = true

[Util]

[Util.Captcha]
Length = 4
Width = 400
Height = 160
CacheType = "memory" # memory/redis

[Util.Captcha.Redis]
Addr = "" # If empty, then use the same configuration as Storage.Cache.Redis
Username = ""
Password = ""
DB = 1
KeyPrefix = "captcha:"

[Util.Prometheus]
Enable = false
Port = 9100
BasicUsername = "admin"
BasicPassword = "admin"
LogApis = [] # Log APIs, e.g. ["/api/v1/users"]
LogMethods = [] # Log HTTP methods, e.g. ["GET"]
DefaultCollect = true

[Dictionary]
UserCacheExp = 4 # hours

[Trading.AccountSync]
Enabled = true
IntervalSeconds = 300
TimeoutSeconds = 60
SnapshotIntervalHours = 12
SnapshotTimeZone = "Asia/Shanghai"

[Trading.UserStream]
# Read-only private order/account events. Explicitly enable after credentials are configured.
Enabled = false

[Trading.TelegramBot]
# Local deployments use long polling and do not require a public HTTPS webhook.
# Enabling this permits outbound requests and user-triggered replies to Telegram.
Enabled = false
PollTimeoutSeconds = 25
RefreshSeconds = 30
BindingTTLMinutes = 10

[Trading.Notifications]
# Automatic signal, approval and execution-result delivery. Manual channel tests are independent.
Enabled = false
ApprovalBaseURL = "http://127.0.0.1:8000/trading-data/approvals"

[Trading.MarketStream]
# Public Binance liquidation stream. Data starts accumulating after enablement.
Enabled = false
RetentionHours = 168
Endpoint = "wss://fstream.binance.com/ws/!forceOrder@arr"

[Trading.Execution]
# Hard safety gate. Enabling this still permits testnet accounts only.
Enabled = false
TestnetOnly = true
TimeoutSeconds = 15
